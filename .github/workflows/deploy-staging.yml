name: Deploy staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging]

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to staging server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << 'EOF'
            set -e

            cd ~/oclaris

            echo "[STAGING] Fetch + reset sur origin/staging"
            git fetch origin
            git checkout staging
            git reset --hard origin/staging

            echo "[STAGING] Deploy stack staging"
            docker compose -p oclaris-staging -f docker-compose.staging.yml down
            docker compose -p oclaris-staging -f docker-compose.staging.yml up -d --build
          EOF
