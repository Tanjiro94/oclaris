name: Deploy staging

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/oclaris_actions
          chmod 600 ~/.ssh/oclaris_actions
          ssh-keyscan -H ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        run: |
          ssh -i ~/.ssh/oclaris_actions \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << 'EOF'
            set -e
            cd ~/oclaris

            echo "[STAGING] Fetch + reset sur origin/staging"
            git fetch --all
            git reset --hard origin/staging

            echo "[STAGING] docker-compose down"
            docker-compose -f docker-compose.staging.yml down

            echo "[STAGING] docker-compose pull"
            docker-compose -f docker-compose.staging.yml pull

            echo "[STAGING] docker-compose up -d --build"
            docker-compose -f docker-compose.staging.yml up -d --build

            echo "[STAGING] ps"
            docker-compose -f docker-compose.staging.yml ps
          EOF
