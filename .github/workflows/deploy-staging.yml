name: Deploy staging

on:
  # 🔗 Ce workflow se déclenche quand le workflow "CI" est terminé
  workflow_run:
    workflows: ["CI"]         # <= nom du workflow CI (dans l’onglet Actions)
    types:
      - completed
    branches:
      - staging               # on ne déploie que pour la branche staging

jobs:
  deploy-staging:
    # Ne déployer que si la CI est en succès
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/oclaris_actions
          chmod 600 ~/.ssh/oclaris_actions

          ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        run: |
          ssh -i ~/.ssh/oclaris_actions \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.STAGING_SSH_USER }}"@"${{ secrets.STAGING_SSH_HOST }}" << 'EOF'
          set -e

          cd ~/oclaris

          # Récupère la dernière version de staging
          git fetch origin
          git reset --hard origin/staging

          # Redémarre proprement les containers
          docker-compose -f docker-compose.staging.yml down
          docker-compose -f docker-compose.staging.yml up -d --build
          EOF
