name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-prod:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy to production server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} << 'EOF'
            set -e

            cd ~/oclaris

            echo "[PROD] Fetch + reset sur origin/main"
            git fetch origin
            git checkout main
            git reset --hard origin/main

            echo "[PROD] Deploy stack prod"
            docker compose -p oclaris-prod -f docker-compose.prod.yml down
            docker compose -p oclaris-prod -f docker-compose.prod.yml up -d --build
          EOF