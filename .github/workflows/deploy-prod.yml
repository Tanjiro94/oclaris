name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-prod:
    # Ne déploie que si la CI sur main est OK
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (optional)
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # On réutilise la même clé / serveur que staging
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to production server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << 'EOF'
            set -e

            cd ~/oclaris

            # Récupérer le dernier code de MAIN
            git fetch origin
            git checkout main
            git reset --hard origin/main

            # Pour l'instant on déploie avec le même stack que staging
            docker-compose -f docker-compose.staging.yml down
            docker-compose -f docker-compose.staging.yml up -d --build
          EOF

